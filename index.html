<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accra Vibes — Alpha 0.3</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#a8d9ee;font-family:system-ui,sans-serif;color:#fff}canvas{display:block}
#ui{position:fixed;top:14px;left:14px;width:min(295px,66vw);background:#142437e8;padding:14px;border-radius:15px;z-index:3;box-shadow:0 10px 30px #0003}h1{margin:0;color:#ffd24f;font-size:23px}small{color:#c6d5e2}#wallet{font-size:24px;font-weight:bold;margin:8px 0}#mission{font-size:13px;margin:8px 0}
#buttons{display:grid;grid-template-columns:1fr 1fr;gap:5px}button{cursor:pointer;border:0;background:#ffd04c;border-radius:8px;padding:9px 5px;color:#182333;font-weight:750}button:active{filter:brightness(.88)}
#message{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#18293fe8;border-radius:11px;padding:10px 14px;z-index:4;max-width:40vw;text-align:center;font-size:13px}
#mini{position:fixed;top:15px;right:15px;width:145px;height:145px;background:#365c52;border:3px solid #fff8;border-radius:12px;z-index:2}
#help{position:fixed;bottom:15px;left:15px;background:#172c40d9;padding:9px;border-radius:9px;font-size:12px;z-index:2}
#pad{position:fixed;right:16px;bottom:18px;z-index:5;display:grid;grid-template-columns:repeat(3,58px);gap:6px;touch-action:none;user-select:none}#pad button{height:58px;font-size:23px;background:#fffde;touch-action:none}#pad span{width:58px}#mobileAction{display:none}
@media(min-width:850px){#pad{display:none}}@media(max-width:849px){#mobileAction{display:block;position:fixed;right:20px;bottom:230px;z-index:5;background:#ffd04c;border-radius:50%;height:66px;width:66px;box-shadow:0 4px 18px #0006}#help{bottom:8px;font-size:11px;max-width:195px}#ui{max-height:65vh;overflow:auto}}@media(max-width:560px){#ui{padding:9px;width:205px}h1{font-size:18px}#wallet{font-size:18px}#mini{width:105px;height:105px}#message{top:133px;max-width:90vw}#help{max-width:200px}}
</style></head><body>
<div id="ui"><h1>🇬🇭 ACCRA VIBES</h1><small>OSU · ALPHA 0.3</small><div id="wallet"></div><div id="mission"></div>
<div id="buttons"><button id="act">Interact [E]</button><button id="car"></button><button id="home"></button><button id="kiosk"></button><button id="reset">Reset</button></div><small id="stats"></small></div>
<div id="message">Welcome to Osu! Follow the orange pickup marker.</div><canvas id="mini" width="145" height="145"></canvas>
<div id="help">W forward · S backward · A left · D right · E interact · F drive · Drag to rotate view · Autosaves locally</div>
<button id="mobileAction">ACT</button><div id="pad"><span></span><button data-k="arrowup">▲</button><span></span><button data-k="arrowleft">◀</button><button data-k="arrowdown">▼</button><button data-k="arrowright">▶</button></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#9dd4ec');scene.fog=new THREE.Fog('#9dd4ec',90,230);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,400),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x6d7f61,2.3));const sun=new THREE.DirectionalLight(0xffebbb,2.2);sun.position.set(40,75,20);scene.add(sun);
const material=c=>new THREE.MeshLambertMaterial({color:c});
function cube(x,y,z,w,h,d,m){const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);obj.position.set(x,y,z);scene.add(obj);return obj}
cube(0,-.3,0,220,.55,220,material('#76a66d'));
const street=material('#434b55'),lane=material('#ebd995');
for(let a=-70;a<=70;a+=35){cube(a,.01,0,10,.1,220,street);cube(0,.01,a,220,.1,10,street);
for(let b=-100;b<100;b+=12){cube(a,.08,b,.25,.02,5,lane);cube(b,.08,a,5,.02,.25,lane)}}
const facade=['#edb18c','#f1ca8b','#86b3b6','#dc989b','#e5dcc4'];
for(let x=-92;x<=92;x+=16)for(let z=-92;z<=92;z+=16){if([-70,-35,0,35,70].some(a=>Math.abs(x-a)<12||Math.abs(z-a)<12))continue;
let h=6+Math.abs(Math.sin(x*1.7+z*.9))*12;cube(x,h/2,z,10,h,10,material(facade[Math.abs(Math.round(x+z))%5]));
cube(x,h+.2,z,11,.5,11,material('#a35d4b'));for(let y=3;y<h;y+=3)cube(x,y,z+5.08,6,.8,.15,material('#456a83'))}
function sign(txt,x,z){const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#13273c';ctx.fillRect(0,0,512,96);ctx.fillStyle='#ffd04c';ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.fillText(txt,256,63);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.position.set(x,7,z);s.scale.set(16,3,1);scene.add(s)}
sign('OSU • OXFORD ST',0,-7);sign('CHOP BAR',-19,-19);sign('ACCRA VIBES KIOSK',52,17);sign('APARTMENTS',-53,17);
for(let i=0;i<24;i++){let x=Math.sin(i*8)*97,z=Math.cos(i*13)*97;if([-70,-35,0,35,70].some(a=>Math.abs(x-a)<10||Math.abs(z-a)<10))continue;cube(x,1,z,.5,2,.5,material('#765239'));const crown=new THREE.Mesh(new THREE.SphereGeometry(2,9,7),material('#338250'));crown.position.set(x,3,z);scene.add(crown)}
const pedestrians=[];for(let i=0;i<19;i++){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.CylinderGeometry(.37,.44,1.2,8),material(['#c95043','#2b8ca6','#eeae37','#e0d4ae'][i%4])),head=new THREE.Mesh(new THREE.SphereGeometry(.32,9,8),material(['#784f31','#ad7750','#583d2e'][i%3]));body.position.y=1.1;head.position.y=1.98;g.add(body,head);scene.add(g);pedestrians.push({g,x:Math.sin(i*2.4)*83,z:Math.cos(i*3.5)*83,dir:i*.8,speed:.5+(i%4)*.25})}
for(let i=0;i<10;i++){let x=(i%5-2)*35+8,z=(i<5?-35:35)+8;cube(x,.8,z,2,1.1,3.5,material(['#efcc4c','#dbddd5','#b45045'][i%3]));cube(x,1.55,z,1.7,.6,2,material('#41667a'))}
const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.CylinderGeometry(.45,.52,1.4,9),material('#ffbd36'));torso.position.y=1.3;const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,9),material('#885838'));head.position.y=2.35;player.add(torso,head);scene.add(player);
const vehicle=new THREE.Group();let base=new THREE.Mesh(new THREE.BoxGeometry(2,1,3.6),material('#f4ce43'));base.position.y=.8;let roof=new THREE.Mesh(new THREE.BoxGeometry(1.7,.75,2),material('#28495d'));roof.position.y=1.6;vehicle.add(base,roof);for(let x of [-1,1])for(let z of [-1.15,1.15]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,12),material('#222'));w.rotation.z=Math.PI/2;w.position.set(x,.43,z);vehicle.add(w)}scene.add(vehicle);
let state;try{state=JSON.parse(localStorage.getItem('av-alpha-02'))}catch{}state={x:0,z:5,cash:500,mission:0,deliveries:0,car:false,home:false,kiosk:false,...state};
let driving=false;const markers=[{x:-19,z:-19,col:'#ff9f2f'},{x:18,z:18,col:'#41e78a'}].map(p=>{const obj=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.16,24),new THREE.MeshBasicMaterial({color:p.col}));scene.add(obj);return {...p,obj}});
const $=id=>document.getElementById(id),save=()=>localStorage.setItem('av-alpha-02',JSON.stringify(state));
function notice(s){$('message').textContent=s}function renderHud(){$('wallet').textContent='GH₵ '+state.cash.toLocaleString();$('mission').textContent=state.mission===0?'MISSION: Collect food at orange marker.':'MISSION: Deliver food to green marker.';$('car').textContent=state.car?'Drive / Walk':'Buy car ₵500';$('home').textContent=state.home?'Home ✓':'Rent ₵300';$('kiosk').textContent=state.kiosk?'Kiosk ✓':'Kiosk ₵900';$('stats').textContent='Deliveries: '+state.deliveries+' • Saved locally';markers.forEach((p,i)=>p.obj.visible=i===state.mission)}
function buy(k,cost){if(state[k])return notice('Already owned.');if(state.cash<cost)return notice('Not enough money. Complete some deliveries.');state.cash-=cost;state[k]=true;save();renderHud();notice('Purchased '+k+'!')}
function interact(){const t=markers[state.mission];if(Math.hypot(state.x-t.x,state.z-t.z)>8)return notice('Get closer to the mission marker.');if(state.mission===0){state.mission=1;notice('Order collected! Deliver to green marker.')}else{state.mission=0;state.cash+=75;state.deliveries++;notice('Delivery complete! +GH₵75')}save();renderHud()}
$('act').onclick=interact;$('mobileAction').onclick=interact;$('car').onclick=()=>state.car?(driving=!driving,notice(driving?'Driving mode':'Walking mode')):buy('car',500);$('home').onclick=()=>buy('home',300);$('kiosk').onclick=()=>buy('kiosk',900);$('reset').onclick=()=>{if(confirm('Reset this game save?')){localStorage.removeItem('av-alpha-02');location.reload()}};
const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='e')interact();if(k==='f'&&state.car){driving=!driving;notice(driving?'Driving mode':'Walking mode')}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel'])b.addEventListener(event,()=>keys[k]=false)});
let orbit=0,drag=false,px=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;px=e.clientX});addEventListener('pointerup',()=>drag=false);addEventListener('pointermove',e=>{if(drag){orbit+=(e.clientX-px)*.004;px=e.clientX}});
let prev=performance.now(),persist=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-prev)/1000,.04);prev=now;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;const moveX=dx*Math.cos(orbit)+dz*Math.sin(orbit),moveZ=dz*Math.cos(orbit)-dx*Math.sin(orbit);dx=moveX;dz=moveZ;
if(dx||dz){state.x=THREE.MathUtils.clamp(state.x+dx*dt*(driving?20:7),-102,102);state.z=THREE.MathUtils.clamp(state.z+dz*dt*(driving?20:7),-102,102);const rot=Math.atan2(dx,dz);player.rotation.y=rot;vehicle.rotation.y=rot}
player.position.set(state.x,0,state.z);player.visible=!driving;vehicle.position.set(state.x,0,state.z);vehicle.visible=driving;
for(let p of pedestrians){p.x+=Math.sin(p.dir)*p.speed*dt;p.z+=Math.cos(p.dir)*p.speed*dt;if(Math.abs(p.x)>95||Math.abs(p.z)>95)p.dir+=Math.PI;p.g.position.set(p.x,0,p.z);p.g.rotation.y=p.dir}
const target=new THREE.Vector3(state.x+16*Math.sin(orbit),driving?13:10,state.z+16*Math.cos(orbit));camera.position.lerp(target,.07);camera.lookAt(state.x,1.4,state.z);markers.forEach((p,i)=>p.obj.position.set(p.x,.3+.12*Math.sin(now*.003+i),p.z));
const c=$('mini'),ctx=c.getContext('2d');ctx.clearRect(0,0,145,145);ctx.fillStyle='#578363';ctx.fillRect(0,0,145,145);ctx.strokeStyle='#b8b49f';ctx.lineWidth=6;for(let a=-70;a<=70;a+=35){const v=(a+105)/210*145;ctx.beginPath();ctx.moveTo(v,0);ctx.lineTo(v,145);ctx.moveTo(0,v);ctx.lineTo(145,v);ctx.stroke()}for(const p of markers){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc((p.x+105)/210*145,(p.z+105)/210*145,5,0,7);ctx.fill()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((state.x+105)/210*145,(state.z+105)/210*145,4,0,7);ctx.fill();
persist+=dt;if(persist>3){save();persist=0}renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderHud();requestAnimationFrame(frame);
</script></body></html>
