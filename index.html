let driving=false,carSpeed=0,carHeading=0;const markers=[{x:-19,z:-19,col:'#ff9f2f'},{x:18,z:18,col:'#41e78a'}].map(p=>{const obj=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.16,24),new THREE.MeshBasicMaterial({color:p.col}));scene.add(obj);return {...p,obj}});
const $=id=>document.getElementById(id),save=()=>localStorage.setItem('av-alpha-02',JSON.stringify(state));
function notice(s){$('message').textContent=s}function renderHud(){$('wallet').textContent='GH₵ '+state.cash.toLocaleString();$('mission').textContent=state.mission===0?'MISSION: Collect food at orange marker.':'MISSION: Deliver food to green marker.';$('car').textContent=state.car?'Drive / Walk':'Buy car ₵500';$('home').textContent=state.home?'Home ✓':'Rent ₵300';$('kiosk').textContent=state.kiosk?'Kiosk ✓':'Kiosk ₵900';$('stats').textContent='Deliveries: '+state.deliveries+' • Saved locally';markers.forEach((p,i)=>p.obj.visible=i===state.mission)}
function buy(k,cost){if(state[k])return notice('Already owned.');if(state.cash<cost)return notice('Not enough money. Complete some deliveries.');state.cash-=cost;state[k]=true;save();renderHud();notice('Purchased '+k+'!')}
function interact(){if(!driving){let near=null,dist=4;for(const p of pedestrians){const d=Math.hypot(state.x-p.x,state.z-p.z);if(d<dist){dist=d;near=p}}if(near){near.chatCooldown=8;near.dir=Math.atan2(state.x-near.x,state.z-near.z);const lines=['Chale, how far? Welcome to Osu!','You dey go Oxford Street? Plenty things dey there.','Good afternoon! How the hustle?','Ei, Accra traffic no be small!','You for try the waakye around here.','Medaase! Enjoy your day.'];return notice(lines[Math.floor(Math.random()*lines.length)])}}const t=markers[state.mission];if(Math.hypot(state.x-t.x,state.z-t.z)>8)return notice('Get closer to the mission marker.');if(state.mission===0){state.mission=1;notice('Order collected! Deliver to green marker.')}else{state.mission=0;state.cash+=75;state.deliveries++;notice('Delivery complete! +GH₵75')}save();renderHud()}
$('act').onclick=interact;$('mobileAction').onclick=interact;$('car').onclick=()=>state.car?(driving=!driving,notice(driving?'Driving: forward accelerates, left/right steers':'Walking mode')):buy('car',500);$('home').onclick=()=>buy('home',300);$('kiosk').onclick=()=>buy('kiosk',900);$('reset').onclick=()=>{if(confirm('Reset this game save?')){localStorage.removeItem('av-alpha-02');location.reload()}};
const joystick={x:0,y:0,active:false},joyEl=$('joystick'),stick=$('stick');let joyPointer=null;
function setJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.36;let x=e.clientX-cx,y=e.clientY-cy;const d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}joystick.x=x/max;joystick.y=y/max;stick.style.transform='translate('+x+'px,'+y+'px)'}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joystick.active=true;joyEl.setPointerCapture(e.pointerId);setJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(joyPointer===e.pointerId)setJoy(e)});
function releaseJoy(e){if(joyPointer!==e.pointerId)return;joyPointer=null;joystick.active=false;joystick.x=0;joystick.y=0;stick.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',releaseJoy);joyEl.addEventListener('pointercancel',releaseJoy);
$('mobileDrive').onclick=()=>state.car?(driving=!driving,notice(driving?'Driving: joystick forward accelerates':'Walking')):notice('Buy a car first.');
const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='e')interact();if(k==='f'&&state.car){driving=!driving;notice(driving?'Driving mode':'Walking mode')}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let orbit=0,dragPointer=null,px=0;renderer.domElement.style.touchAction='none';renderer.domElement.addEventListener('pointerdown',e=>{dragPointer=e.pointerId;px=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===dragPointer)dragPointer=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===dragPointer)dragPointer=null});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===dragPointer){orbit+=(e.clientX-px)*.004;px=e.clientX}});
let prev=performance.now(),persist=0,walkPhase=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-prev)/1000,.04);prev=now;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joystick.active){dx=joystick.x;dz=joystick.y}const l=Math.max(1,Math.hypot(dx,dz));dx/=l;dz/=l;const moveX=dx*Math.cos(orbit)+dz*Math.sin(orbit),moveZ=dz*Math.cos(orbit)-dx*Math.sin(orbit);dx=moveX;dz=moveZ;
if(driving){const throttle=-dz;carSpeed+=throttle*26*dt;carSpeed-=Math.sign(carSpeed)*Math.min(Math.abs(carSpeed),7*dt);carSpeed=THREE.MathUtils.clamp(carSpeed,-9,28);if(Math.abs(carSpeed)>.2)carHeading+=dx*dt*1.6*Math.sign(carSpeed)*Math.min(1,Math.abs(carSpeed)/7);state.x=THREE.MathUtils.clamp(state.x+Math.sin(carHeading)*carSpeed*dt,-102,102);state.z=THREE.MathUtils.clamp(state.z+Math.cos(carHeading)*carSpeed*dt,-102,102);vehicle.rotation.y=carHeading}else{carSpeed=0;if(dx||dz){state.x=THREE.MathUtils.clamp(state.x+dx*dt*7,-102,102);state.z=THREE.MathUtils.clamp(state.z+dz*dt*7,-102,102);player.rotation.y=Math.atan2(dx,dz)}}
// Keep the avatar and vehicle outside building footprints.
for(const b of solidBuildings){const ax=state.x-b.x,az=state.z-b.z;if(Math.abs(ax)<b.r&&Math.abs(az)<b.r){const pushX=b.r-Math.abs(ax),pushZ=b.r-Math.abs(az);if(pushX<pushZ)state.x=b.x+Math.sign(ax||1)*b.r;else state.z=b.z+Math.sign(az||1)*b.r}}
walkPhase+=(driving?0:Math.hypot(dx,dz)*dt*10);playAnimation(player.userData.visual,(!driving&&Math.hypot(dx,dz)>.12)?'walk':'idle');for(const limb of limbs){limb.mesh.rotation.x=driving?0:Math.sin(walkPhase)*.5*limb.side*(limb.type==='arm'?-1:1)}
player.position.set(state.x,0,state.z);player.visible=!driving;document.getElementById('speedometer').style.display=driving?'block':'none';if(driving)document.getElementById('speedometer').textContent=Math.round(Math.abs(carSpeed)*5)+' km/h';vehicle.position.set(state.x,0,state.z);vehicle.visible=driving;
for(const t of traffic){t.t+=t.speed*dt;if(t.t>108)t.t=-108;if(t.axis===0){t.g.position.set(t.road+t.side*2.5,0,t.t);t.g.rotation.y=0}else{t.g.position.set(t.t,0,t.road+t.side*2.5);t.g.rotation.y=Math.PI/2}}
for(let p of pedestrians){p.chatCooldown=Math.max(0,p.chatCooldown-dt);const walking=p.chatCooldown===0&&p.behavior!==4;playAnimation(p.visual,walking?'walk':'idle');const speed=walking?p.speed:0;p.x+=Math.sin(p.dir)*speed*dt;p.z+=Math.cos(p.dir)*speed*dt;for(let k=0;k<2;k++){p.legs[k].rotation.x=walking?Math.sin(now*.005+p.phase)*.55*(k?1:-1):0;p.arms[k].rotation.x=walking?Math.sin(now*.005+p.phase)*.45*(k?-1:1):p.chatCooldown>0?-.3:0}if(p.behavior===3&&Math.sin(now*.0007+p.phase)>.97)p.dir+=dt*.6;if(Math.abs(p.x)>95||Math.abs(p.z)>95)p.dir+=Math.PI;p.g.position.set(p.x,0,p.z);p.g.rotation.y=p.dir;p.g.position.y=.055*Math.sin(now*.006+p.phase)}
const target=new THREE.Vector3(state.x+(driving?21:13)*Math.sin(orbit),driving?10:7,state.z+(driving?21:13)*Math.cos(orbit));camera.position.lerp(target,.11);camera.lookAt(state.x,1.4,state.z);markers.forEach((p,i)=>p.obj.position.set(p.x,.3+.12*Math.sin(now*.003+i),p.z));
const c=$('mini'),ctx=c.getContext('2d');ctx.clearRect(0,0,145,145);ctx.fillStyle='#578363';ctx.fillRect(0,0,145,145);ctx.strokeStyle='#b8b49f';ctx.lineWidth=6;for(let a=-70;a<=70;a+=35){const v=(a+105)/210*145;ctx.beginPath();ctx.moveTo(v,0);ctx.lineTo(v,145);ctx.moveTo(0,v);ctx.lineTo(145,v);ctx.stroke()}for(const p of markers){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc((p.x+105)/210*145,(p.z+105)/210*145,5,0,7);ctx.fill()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((state.x+105)/210*145,(state.z+105)/210*145,4,0,7);ctx.fill();
for(const mixer of mixers)mixer.update(dt);persist+=dt;if(persist>3){save();persist=0}renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderHud();requestAnimationFrame(frame);
</script></body></html>
