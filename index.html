<div id="ui"><h1>🇬🇭 ACCRA VIBES</h1><small>OSU · ALPHA 0.7</small><div id="wallet"></div><div id="mission"></div>
<div id="buttons"><button id="act">Interact [E]</button><button id="car"></button><button id="home"></button><button id="kiosk"></button><button id="reset">Reset</button></div><small id="stats"></small></div>

<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#9dd4ec');scene.fog=new THREE.Fog('#9dd4ec',90,230);

scene.add(new THREE.HemisphereLight(0xffffff,0x6d7f61,2.3));const sun=new THREE.DirectionalLight(0xffebbb,2.2);sun.position.set(40,75,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-115;sun.shadow.camera.right=115;sun.shadow.camera.top=115;sun.shadow.camera.bottom=-115;sun.shadow.normalBias=.03;scene.add(sun);
const material=c=>new THREE.MeshLambertMaterial({color:c});
function cube(x,y,z,w,h,d,m){const obj=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);obj.position.set(x,y,z);obj.castShadow=h>1;obj.receiveShadow=true;scene.add(obj);return obj}
cube(0,-.3,0,220,.55,220,material('#76a66d'));
const street=material('#434b55'),lane=material('#ebd995'),pavement=material('#c4b9a2');
for(let a=-70;a<=70;a+=35){for(const side of [-1,1]){cube(a+side*6,.055,0,1.8,.16,220,pavement);cube(0,.055,a+side*6,220,.16,1.8,pavement)}}

for(let a=-70;a<=70;a+=35){cube(a,.01,0,10,.1,220,street);cube(0,.01,a,220,.1,10,street);
for(let b=-100;b<100;b+=12){cube(a,.08,b,.25,.02,5,lane);cube(b,.08,a,5,.02,.25,lane)}}
const solidBuildings=[];const facade=['#edb18c','#f1ca8b','#86b3b6','#dc989b','#e5dcc4'];
for(let x=-92;x<=92;x+=16)for(let z=-92;z<=92;z+=16){if([-70,-35,0,35,70].some(a=>Math.abs(x-a)<12||Math.abs(z-a)<12))continue;
let h=6+Math.abs(Math.sin(x*1.7+z*.9))*12;cube(x,h/2,z,10,h,10,material(facade[Math.abs(Math.round(x+z))%5]));solidBuildings.push({x,z,r:6.5});
cube(x,h+.2,z,11,.5,11,material('#a35d4b'));for(let y=3;y<h;y+=3)cube(x,y,z+5.08,6,.8,.15,material('#456a83'))}
function sign(txt,x,z){const c=document.createElement('canvas');c.width=512;c.height=96;const ctx=c.getContext('2d');ctx.fillStyle='#13273c';ctx.fillRect(0,0,512,96);ctx.fillStyle='#ffd04c';ctx.font='bold 38px sans-serif';ctx.textAlign='center';ctx.fillText(txt,256,63);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c)}));s.position.set(x,7,z);s.scale.set(16,3,1);scene.add(s)}
sign('OSU • OXFORD ST',0,-7);sign('CHOP BAR',-19,-19);sign('ACCRA VIBES KIOSK',52,17);sign('APARTMENTS',-53,17);sign('WELCOME TO OSU',0,53);sign('WAKEY WAKEY CHOP BAR',-52,-54);sign('ACCRA TAXI RANK',42,-53);
const accents=['#d9a51e','#d33b35','#248a52','#ece5d2'];
for(let i=0;i<14;i++){const x=-88+(i%7)*29,z=i<7?49:-52;const kioskBody=cube(x,1.35,z,5,2.7,3.8,material(accents[i%4]));cube(x,2.9,z,6,.4,4.5,material('#9e4731'));cube(x,1.8,z+2.02,3,1,.12,material('#302c2b'));if(i%3===0)sign(['MOBILE MONEY','WAakye & Jollof','PROVISIONS'][i%3],x,z)}
for(let i=0;i<9;i++){const x=-82+i*20,z=i%2?62:-63;cube(x,.65,z,2.1,1.2,4,material(i%3===0?'#e5c130':'#d8dad6'));cube(x,1.45,z,1.8,.5,2,material('#354c63'));if(i%3===0)cube(x,.45,z+2.15,1.5,.5,.2,material('#30302f'))}
for(let i=0;i<8;i++){const x=-76+i*21,z=i%2?78:-80;cube(x,1.2,z,3.1,2.2,7.5,material('#d6a743'));cube(x,2.3,z,2.7,.7,5,material('#315e83'));cube(x,2.65,z,3.2,.2,7.7,material('#e4d7b3'))}

// Street furniture, greenery and distinctive Accra atmosphere
const trunkMat=material('#795337'),leafMat=material('#267c49');
for(let i=0;i<34;i++){let x=-99+(i%17)*12,z=i<17?95:-95;cube(x,1.6,z,.38,3.2,.38,trunkMat);const palm=new THREE.Mesh(new THREE.SphereGeometry(2.4,7,5),leafMat);palm.position.set(x,4,z);palm.castShadow=true;scene.add(palm)}
for(let i=0;i<22;i++){const x=-96+(i%11)*19,z=i<11?43:-43;cube(x,3.5,z,.17,7,.17,material('#77818a'));cube(x,7,z,.9,.3,.35,material('#f7e9aa'))}
for(let i=0;i<24;i++){let x=Math.sin(i*8)*97,z=Math.cos(i*13)*97;if([-70,-35,0,35,70].some(a=>Math.abs(x-a)<10||Math.abs(z-a)<10))continue;cube(x,1,z,.5,2,.5,material('#765239'));const crown=new THREE.Mesh(new THREE.SphereGeometry(2,9,7),material('#338250'));crown.position.set(x,3,z);scene.add(crown)}
const pedestrians=[];for(let i=0;i<19;i++){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.CylinderGeometry(.37,.44,1.2,8),material(['#c95043','#2b8ca6','#eeae37','#e0d4ae'][i%4])),head=new THREE.Mesh(new THREE.SphereGeometry(.32,9,8),material(['#784f31','#ad7750','#583d2e'][i%3]));body.position.y=1.1;head.position.y=1.98;g.add(body,head);scene.add(g);pedestrians.push({g,x:Math.sin(i*2.4)*83,z:Math.cos(i*3.5)*83,dir:i*.8,speed:.5+(i%4)*.25,phase:i*.8})}
for(let i=0;i<10;i++){let x=(i%5-2)*35+8,z=(i<5?-35:35)+8;cube(x,.8,z,2,1.1,3.5,material(['#efcc4c','#dbddd5','#b45045'][i%3]));cube(x,1.55,z,1.7,.6,2,material('#41667a'))}
const traffic=[];
for(let i=0;i<12;i++){const van=i%3===0,g=new THREE.Group(),paint=material(van?'#f1d44c':i%2?'#efc849':'#e9e8df');
const body=new THREE.Mesh(new THREE.BoxGeometry(van?2.7:2.1,van?2.15:1.1,van?5.7:4),paint);body.position.y=van?1.45:.85;g.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(van?2.45:1.8,van?.95:.65,van?3.5:2.1),material('#36596d'));cabin.position.y=van?2.2:1.6;g.add(cabin);
for(const side of [-1,1])for(const end of [-1,1]){const tire=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.28,10),material('#23262c'));tire.rotation.z=Math.PI/2;tire.position.set(side*(van?1.4:1.05),.48,end*(van?1.9:1.25));g.add(tire)}
g.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(g);
traffic.push({g,axis:i%2,road:[-70,-35,0,35,70][i%5],t:-92+i*16,speed:5+(i%4)*2,side:i%2?1:-1})}
const player=new THREE.Group();const torso=new THREE.Mesh(new THREE.CylinderGeometry(.45,.52,1.4,9),material('#ffbd36'));torso.position.y=1.3;const head=new THREE.Mesh(new THREE.SphereGeometry(.38,12,9),material('#885838'));head.position.y=2.35;player.add(torso,head);
const armMat=material('#885838'),shoeMat=material('#252a38'),limbs=[];
for(const side of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.15,.7,4,6),armMat);arm.position.set(side*.65,1.25,0);arm.rotation.z=side*.12;player.add(arm);limbs.push({mesh:arm,side,type:'arm'});const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.65,4,6),material('#243b69'));leg.position.set(side*.24,.42,0);player.add(leg);limbs.push({mesh:leg,side,type:'leg'});const shoe=new THREE.Mesh(new THREE.BoxGeometry(.4,.2,.65),shoeMat);shoe.position.set(side*.24,.15,-.12);player.add(shoe)}
const hair=new THREE.Mesh(new THREE.SphereGeometry(.39,12,8,0,Math.PI*2,0,Math.PI*.4),material('#222026'));hair.position.y=2.43;player.add(hair);player.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(player);
const vehicle=new THREE.Group();let base=new THREE.Mesh(new THREE.BoxGeometry(2,1,3.6),material('#f4ce43'));base.position.y=.8;let roof=new THREE.Mesh(new THREE.BoxGeometry(1.7,.75,2),material('#28495d'));roof.position.y=1.6;vehicle.add(base,roof);for(let x of [-1,1])for(let z of [-1.15,1.15]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,12),material('#222'));w.rotation.z=Math.PI/2;w.position.set(x,.43,z);vehicle.add(w)}for(const side of [-1,1]){const light=new THREE.Mesh(new THREE.BoxGeometry(.48,.2,.12),new THREE.MeshBasicMaterial({color:'#fff0a6'}));light.position.set(side*.65,.83,-1.84);vehicle.add(light);const tail=new THREE.Mesh(new THREE.BoxGeometry(.42,.19,.12),new THREE.MeshBasicMaterial({color:'#c91e2d'}));tail.position.set(side*.65,.85,1.84);vehicle.add(tail)}vehicle.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(vehicle);
let state;try{state=JSON.parse(localStorage.getItem('av-alpha-02'))}catch{}state={x:0,z:5,cash:500,mission:0,deliveries:0,car:false,home:false,kiosk:false,...state};
let driving=false,carSpeed=0,carHeading=0;const markers=[{x:-19,z:-19,col:'#ff9f2f'},{x:18,z:18,col:'#41e78a'}].map(p=>{const obj=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.2,.16,24),new THREE.MeshBasicMaterial({color:p.col}));scene.add(obj);return {...p,obj}});
const $=id=>document.getElementById(id),save=()=>localStorage.setItem('av-alpha-02',JSON.stringify(state));
function notice(s){$('message').textContent=s}function renderHud(){$('wallet').textContent='GH₵ '+state.cash.toLocaleString();$('mission').textContent=state.mission===0?'MISSION: Collect food at orange marker.':'MISSION: Deliver food to green marker.';$('car').textContent=state.car?'Drive / Walk':'Buy car ₵500';$('home').textContent=state.home?'Home ✓':'Rent ₵300';$('kiosk').textContent=state.kiosk?'Kiosk ✓':'Kiosk ₵900';$('stats').textContent='Deliveries: '+state.deliveries+' • Saved locally';markers.forEach((p,i)=>p.obj.visible=i===state.mission)}
function buy(k,cost){if(state[k])return notice('Already owned.');if(state.cash<cost)return notice('Not enough money. Complete some deliveries.');state.cash-=cost;state[k]=true;save();renderHud();notice('Purchased '+k+'!')}
function interact(){const t=markers[state.mission];if(Math.hypot(state.x-t.x,state.z-t.z)>8)return notice('Get closer to the mission marker.');if(state.mission===0){state.mission=1;notice('Order collected! Deliver to green marker.')}else{state.mission=0;state.cash+=75;state.deliveries++;notice('Delivery complete! +GH₵75')}save();renderHud()}
$('act').onclick=interact;$('mobileAction').onclick=interact;$('car').onclick=()=>state.car?(driving=!driving,notice(driving?'Driving: forward accelerates, left/right steers':'Walking mode')):buy('car',500);$('home').onclick=()=>buy('home',300);$('kiosk').onclick=()=>buy('kiosk',900);$('reset').onclick=()=>{if(confirm('Reset this game save?')){localStorage.removeItem('av-alpha-02');location.reload()}};
const joystick={x:0,y:0,active:false},joyEl=$('joystick'),stick=$('stick');let joyPointer=null;
function setJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.36;let x=e.clientX-cx,y=e.clientY-cy;const d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}joystick.x=x/max;joystick.y=y/max;stick.style.transform='translate('+x+'px,'+y+'px)'}
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joystick.active=true;joyEl.setPointerCapture(e.pointerId);setJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(joyPointer===e.pointerId)setJoy(e)});
function releaseJoy(e){if(joyPointer!==e.pointerId)return;joyPointer=null;joystick.active=false;joystick.x=0;joystick.y=0;stick.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',releaseJoy);joyEl.addEventListener('pointercancel',releaseJoy);
$('mobileDrive').onclick=()=>state.car?(driving=!driving,notice(driving?'Driving: joystick forward accelerates':'Walking')):notice('Buy a car first.');
const keys={};addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='e')interact();if(k==='f'&&state.car){driving=!driving;notice(driving?'Driving mode':'Walking mode')}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let orbit=0,dragPointer=null,px=0;renderer.domElement.style.touchAction='none';renderer.domElement.addEventListener('pointerdown',e=>{dragPointer=e.pointerId;px=e.clientX;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===dragPointer)dragPointer=null});renderer.domElement.addEventListener('pointercancel',e=>{if(e.pointerId===dragPointer)dragPointer=null});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId===dragPointer){orbit+=(e.clientX-px)*.004;px=e.clientX}});
let prev=performance.now(),persist=0,walkPhase=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-prev)/1000,.04);prev=now;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(joystick.active){dx=joystick.x;dz=joystick.y}const l=Math.max(1,Math.hypot(dx,dz));dx/=l;dz/=l;const moveX=dx*Math.cos(orbit)+dz*Math.sin(orbit),moveZ=dz*Math.cos(orbit)-dx*Math.sin(orbit);dx=moveX;dz=moveZ;
if(driving){const throttle=-dz;carSpeed+=throttle*26*dt;carSpeed-=Math.sign(carSpeed)*Math.min(Math.abs(carSpeed),7*dt);carSpeed=THREE.MathUtils.clamp(carSpeed,-9,28);if(Math.abs(carSpeed)>.2)carHeading+=dx*dt*1.6*Math.sign(carSpeed)*Math.min(1,Math.abs(carSpeed)/7);state.x=THREE.MathUtils.clamp(state.x+Math.sin(carHeading)*carSpeed*dt,-102,102);state.z=THREE.MathUtils.clamp(state.z+Math.cos(carHeading)*carSpeed*dt,-102,102);vehicle.rotation.y=carHeading}else{carSpeed=0;if(dx||dz){state.x=THREE.MathUtils.clamp(state.x+dx*dt*7,-102,102);state.z=THREE.MathUtils.clamp(state.z+dz*dt*7,-102,102);player.rotation.y=Math.atan2(dx,dz)}}
// Keep the avatar and vehicle outside building footprints.
for(const b of solidBuildings){const ax=state.x-b.x,az=state.z-b.z;if(Math.abs(ax)<b.r&&Math.abs(az)<b.r){const pushX=b.r-Math.abs(ax),pushZ=b.r-Math.abs(az);if(pushX<pushZ)state.x=b.x+Math.sign(ax||1)*b.r;else state.z=b.z+Math.sign(az||1)*b.r}}
walkPhase+=(driving?0:Math.hypot(dx,dz)*dt*10);for(const limb of limbs){limb.mesh.rotation.x=driving?0:Math.sin(walkPhase)*.5*limb.side*(limb.type==='arm'?-1:1)}
player.position.set(state.x,0,state.z);player.visible=!driving;vehicle.position.set(state.x,0,state.z);vehicle.visible=driving;
for(const t of traffic){t.t+=t.speed*dt;if(t.t>108)t.t=-108;if(t.axis===0){t.g.position.set(t.road+t.side*2.5,0,t.t);t.g.rotation.y=0}else{t.g.position.set(t.t,0,t.road+t.side*2.5);t.g.rotation.y=Math.PI/2}}
for(let p of pedestrians){p.x+=Math.sin(p.dir)*p.speed*dt;p.z+=Math.cos(p.dir)*p.speed*dt;if(Math.abs(p.x)>95||Math.abs(p.z)>95)p.dir+=Math.PI;p.g.position.set(p.x,0,p.z);p.g.rotation.y=p.dir;p.g.position.y=.055*Math.sin(now*.006+p.phase)}
const target=new THREE.Vector3(state.x+(driving?21:13)*Math.sin(orbit),driving?10:7,state.z+(driving?21:13)*Math.cos(orbit));camera.position.lerp(target,.11);camera.lookAt(state.x,1.4,state.z);markers.forEach((p,i)=>p.obj.position.set(p.x,.3+.12*Math.sin(now*.003+i),p.z));
const c=$('mini'),ctx=c.getContext('2d');ctx.clearRect(0,0,145,145);ctx.fillStyle='#578363';ctx.fillRect(0,0,145,145);ctx.strokeStyle='#b8b49f';ctx.lineWidth=6;for(let a=-70;a<=70;a+=35){const v=(a+105)/210*145;ctx.beginPath();ctx.moveTo(v,0);ctx.lineTo(v,145);ctx.moveTo(0,v);ctx.lineTo(145,v);ctx.stroke()}for(const p of markers){ctx.fillStyle=p.col;ctx.beginPath();ctx.arc((p.x+105)/210*145,(p.z+105)/210*145,5,0,7);ctx.fill()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc((state.x+105)/210*145,(state.z+105)/210*145,4,0,7);ctx.fill();
persist+=dt;if(persist>3){save();persist=0}renderer.render(scene,camera)}
