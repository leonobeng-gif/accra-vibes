<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accra Vibes | Character Lab 1.6.1</title><style>body{margin:0;background:#10151c;color:#f1f5f9;font:15px system-ui}#info{position:absolute;top:14px;left:14px;max-width:350px;background:#111b28e8;padding:18px;border-radius:14px}h1{margin:0 0 6px;font-size:21px}p{line-height:1.45;color:#cbd5e1}button{padding:10px 13px;background:#d6aa52;color:#111;border:0;border-radius:8px;font-weight:700;cursor:pointer}#stats{white-space:pre-wrap;font:12px/1.6 monospace}#hint{position:absolute;bottom:15px;left:15px;color:#e2e8f0}</style></head><body><div id="info"><h1>Accra Vibes — Character Lab 1.6.1</h1><p>Isolated model inspection. Import a candidate .glb model for a standalone geometry and animation audit. The live game remains unchanged.</p><label style="display:block;margin-bottom:12px">Load candidate GLB: <input id="modelFile" type="file" accept=".glb,model/gltf-binary" style="max-width:100%"></label><button id="toggle">Pause rotation</button> <button id="reset">Reset camera</button><p id="stats">Loading model…</p><div id="animations"></div></div><div id="hint">Drag to rotate · Scroll/pinch to zoom</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#192331');scene.add(new THREE.HemisphereLight(0xffffff,0x52647a,2));const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(4,8,6);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.05,150);camera.position.set(4,3.3,6);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.25,0);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=20;
const floor=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshStandardMaterial({color:0x344354,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new THREE.GridHelper(12,24,0x8290a0,0x536172));const axes=new THREE.AxesHelper(1);scene.add(axes);
let rotating=true,avatar=null,boundsHelper=null,mixer=null,actions=[];document.getElementById('toggle').onclick=()=>{rotating=!rotating;document.getElementById('toggle').textContent=rotating?'Pause rotation':'Resume rotation'};document.getElementById('reset').onclick=()=>{camera.position.set(4,3.3,6);controls.target.set(0,1.25,0);controls.update()};
const stats=document.getElementById('stats');
function showModel(g,name){
if(avatar){scene.remove(avatar);avatar.traverse(o=>{if(o.isMesh){o.geometry?.dispose();const mats=Array.isArray(o.material)?o.material:[o.material];for(const m of mats){if(m&&m.userData?.labOwned)m.dispose()}}})}
if(boundsHelper){scene.remove(boundsHelper);boundsHelper.geometry.dispose();boundsHelper.material.dispose()}
if(mixer){mixer.stopAllAction();mixer.uncacheRoot(avatar);mixer=null}
avatar=g.scene;const raw=new THREE.Box3().setFromObject(avatar),size=raw.getSize(new THREE.Vector3()),center=raw.getCenter(new THREE.Vector3());
if(!Number.isFinite(size.y)||size.y<=0){stats.textContent='FAIL: Invalid model bounds';avatar=null;return}
const scale=2.55/size.y;avatar.scale.setScalar(scale);avatar.position.set(-center.x*scale,-raw.min.y*scale,-center.z*scale);scene.add(avatar);
const bounds=new THREE.Box3().setFromObject(avatar),dims=bounds.getSize(new THREE.Vector3());boundsHelper=new THREE.Box3Helper(bounds,0xf8cf63);scene.add(boundsHelper);
let meshes=0,verts=0,skinned=0,materials=0,textures=0,bones=0;
avatar.traverse(o=>{if(o.isMesh){meshes++;verts+=o.geometry?.attributes?.position?.count||0;if(o.isSkinnedMesh)skinned++;const ms=Array.isArray(o.material)?o.material:[o.material];materials+=ms.length;for(const m of ms)if(m?.map)textures++}if(o.isBone)bones++});
const ratio=dims.y/Math.max(dims.x,.001);const warnings=[];
if(ratio<1.5)warnings.push('Shape is too wide for a standing human (possibly lying down).');
if(dims.z>1.25)warnings.push('Depth is excessive for a standing character.');
if(!skinned||!bones)warnings.push('No skinned skeleton detected: natural walking animation may not work.');
if(!g.animations.length)warnings.push('No embedded animation clips.');
if(verts<15000)warnings.push('Low mesh detail for the requested realism.');
if(!textures)warnings.push('No color texture maps detected.');
if(verts>120000)warnings.push('High geometry cost for mobile: create a lower-detail variant.');
const clipNames=g.animations.map(c=>c.name);
stats.textContent='ASSET: '+name+'\n'+(warnings.length?'REVIEW REQUIRED':'BASIC TECHNICAL CHECKS PASSED')+'\nHeight / width / depth: '+dims.y.toFixed(2)+' / '+dims.x.toFixed(2)+' / '+dims.z.toFixed(2)+' m\nMeshes: '+meshes+' | vertices: '+verts+'\nSkinned meshes: '+skinned+' | bones: '+bones+'\nMaterials: '+materials+' | texture maps: '+textures+'\nAnimations: '+(clipNames.join(', ')||'none')+'\n\n'+(warnings.length?'ISSUES:\n• '+warnings.join('\n• '):'Geometry looks technically plausible. Visual quality still needs manual review.');
const animBox=document.getElementById('animations');animBox.replaceChildren();if(g.animations.length){mixer=new THREE.AnimationMixer(avatar);for(const clip of g.animations){const btn=document.createElement('button');btn.textContent=clip.name;btn.style.margin='4px';btn.onclick=()=>{mixer.stopAllAction();mixer.clipAction(clip).reset().play()};animBox.appendChild(btn)}}}
const loader=new GLTFLoader();loader.load('/assets/characters/player.glb',g=>showModel(g,'Previous rejected model (reference)'),undefined,e=>stats.textContent='Model load failed: '+e.message);
document.getElementById('modelFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.glb')){stats.textContent='Please choose a .glb file';return}const url=URL.createObjectURL(file);loader.load(url,g=>{URL.revokeObjectURL(url);showModel(g,file.name)},undefined,err=>{URL.revokeObjectURL(url);stats.textContent='Import failed: '+err.message})});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);if(avatar&&rotating)avatar.rotation.y+=dt*.3;if(mixer)mixer.update(dt);last=now;controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
