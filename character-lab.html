<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accra Vibes | Character Lab</title><style>body{margin:0;background:#10151c;color:#f1f5f9;font:15px system-ui}#info{position:absolute;top:14px;left:14px;max-width:350px;background:#111b28e8;padding:18px;border-radius:14px}h1{margin:0 0 6px;font-size:21px}p{line-height:1.45;color:#cbd5e1}button{padding:10px 13px;background:#d6aa52;color:#111;border:0;border-radius:8px;font-weight:700;cursor:pointer}#stats{white-space:pre-wrap;font:12px/1.6 monospace}#hint{position:absolute;bottom:15px;left:15px;color:#e2e8f0}</style></head><body><div id="info"><h1>Accra Vibes — Character Lab</h1><p>Isolated model inspection. This page cannot change the live game. Rotate the view to inspect the entire figure.</p><button id="toggle">Pause rotation</button> <button id="reset">Reset camera</button><p id="stats">Loading model…</p></div><div id="hint">Drag to rotate · Scroll/pinch to zoom</div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'https://esm.sh/three@0.170.0/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#192331');scene.add(new THREE.HemisphereLight(0xffffff,0x52647a,2));const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(4,8,6);scene.add(light);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.05,150);camera.position.set(4,3.3,6);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.25,0);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=20;
const floor=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshStandardMaterial({color:0x344354,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);scene.add(new THREE.GridHelper(12,24,0x8290a0,0x536172));const axes=new THREE.AxesHelper(1);scene.add(axes);
let rotating=true,avatar=null;document.getElementById('toggle').onclick=()=>{rotating=!rotating;document.getElementById('toggle').textContent=rotating?'Pause rotation':'Resume rotation'};document.getElementById('reset').onclick=()=>{camera.position.set(4,3.3,6);controls.target.set(0,1.25,0);controls.update()};
new GLTFLoader().load('/assets/characters/player.glb',g=>{avatar=g.scene;const raw=new THREE.Box3().setFromObject(avatar),size=raw.getSize(new THREE.Vector3());const center=raw.getCenter(new THREE.Vector3());if(!Number.isFinite(size.y)||size.y<=0){document.getElementById('stats').textContent='Invalid model bounds';return}const scale=2.55/size.y;avatar.scale.setScalar(scale);avatar.position.set(-center.x*scale,-raw.min.y*scale,-center.z*scale);scene.add(avatar);const bounds=new THREE.Box3().setFromObject(avatar);const dims=bounds.getSize(new THREE.Vector3());const box=new THREE.Box3Helper(bounds,0xf8cf63);scene.add(box);let meshes=0,verts=0;avatar.traverse(o=>{if(o.isMesh){meshes++;verts+=o.geometry?.attributes?.position?.count||0}});document.getElementById('stats').textContent='Model: existing imported GLB (diagnostic only)\nOriginal dimensions: '+size.toArray().map(n=>n.toFixed(3)).join(' × ')+'\nNormalized dimensions: '+dims.toArray().map(n=>n.toFixed(3)).join(' × ')+'\nMeshes: '+meshes+' | vertices: '+verts+'\nAnimation clips: '+g.animations.map(c=>c.name).join(', ')+'\n\nYellow box shows the full model bounds.';},undefined,e=>document.getElementById('stats').textContent='Model load failed: '+e.message);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let last=performance.now();function frame(now){requestAnimationFrame(frame);if(avatar&&rotating)avatar.rotation.y+=(now-last)*.0003;last=now;controls.update();renderer.render(scene,camera)}requestAnimationFrame(frame);
</script></body></html>
